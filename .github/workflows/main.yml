name: Run analysis & publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main.py (CRISP-DM report + site/results.json)
        run: python main.py

      - name: Assemble site
        run: |
          mkdir -p _site/report
          cp -r site/. _site/
          cp -r output/. _site/report/
          # Append commit version to JS/CSS URLs so browsers do not use stale cache
          sed -i "s#app.js\"#app.js?v=${GITHUB_SHA::7}\"#; s#style.css\"#style.css?v=${GITHUB_SHA::7}\"#" _site/index.html

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: startup-profit-model
          path: startup_profit_model.pkl

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
